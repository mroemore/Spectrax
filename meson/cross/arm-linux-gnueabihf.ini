# Template only. Device-specific flags (-mcpu/-mtune), the target lib dir and
# the raylib platform are injected by scripts/gen-cross-file.sh from the
# device profile. Do not add device facts to this file.
[binaries]
c = 'arm-linux-gnueabihf-gcc'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
spectrax_incdir = 'include/armhf'
spectrax_libdir = 'lib/armhf'
spectrax_platform = 'drm'

[built-in options]
# No -flto here: the locally installed arm-linux-gnueabihf toolchain's LTO
# plugin fails to resolve the project's static archives, so the link fails
# with undefined references to symbols the archives do define. The aarch64
# toolchain links with LTO without trouble.
c_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard',
          '-O3', '-ftree-vectorize', '-ffp-contract=off']
c_link_args = []
