# ALSA configuration for the Spectrax port.
#
# Installed to /storage/.config/asound.conf, which is where ROCKNIX's
# alsa.conf looks for user configuration (/etc is a read-only squashfs).
#
# The named PCMs below are PipeWire-backed with a fixed rate. They exist
# because the raw ALSA paths on this handheld (dmix, hw:0,0) open without
# error, reach RUNNING and advance the hardware pointer -- but never deliver
# a PortAudio callback, so an app that opens them plays the silence it was
# primed with. The PipeWire-backed PCMs deliver callbacks normally.
#
# A fixed rate also lets the client pin its own engine rate: the engine
# synthesises at the rate named here and the server resamples to whatever
# the codec wants. spx24000 halves the per-sample synthesis cost.
#
# SPECTRAX_AUDIO_DEVICE / SPECTRAX_AUDIO_RATE pick between them.

pcm.spx48000 {
    type pipewire
    rate 48000
    hint {
        show on
        description "Spectrax 48k"
    }
}

pcm.spx24000 {
    type pipewire
    rate 24000
    hint {
        show on
        description "Spectrax 24k"
    }
}
